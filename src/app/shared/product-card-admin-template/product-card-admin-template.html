<div class="product-card">
  @if (product) {
    <div class="image-container">
      <img src="/{{ product.picture }}" alt="{{ product.name }} Picture" class="product-img" />
      <div class="menu-container" [class.active]="isMenuOpen()">
        <button class="context-btn" (click)="onToggleMenu($event)" aria-label="Item menu">
          <i class="fa-solid fa-ellipsis-vertical"></i>
        </button>
        @if (isMenuOpen()) {
          <div class="dropdown" [class.active]="isMenuOpen()">
            @if (product.inStock) {
              <button class="dropdown-item" (click)="onArchiveItem()">Archive item</button>
            } @else {
              <button class="dropdown-item" (click)="onUnarchiveItem()">Unarchive item</button>
            }
            <!-- <app-product-details [product]="product" /> -->
            <!-- <button class="btn" (click)="onSelectedProduct()">Show me</button> -->

            <button class="dropdown-item delete-trigger" (click)="onStartDeleteItem($event)">
              Delete item
            </button>
          </div>
        }
      </div>
    </div>
    <div class="product-info">
      @if (!product.inStock) {
        <p>temporary no available</p>
      }
      <p class="product-title">{{ product.name }}</p>
      <span class="product-price">{{ product.price | currency: 'RUB' : 'symbol' }}</span>
    </div>
  }
</div>

<dialog
  (click)="onCancelToDelete()"
  [open]="isOpenDeleteForm()"
  [class.active]="isOpenDeleteForm()"
>
  <form id="toDelete" class="form" (ngSubmit)="onConfirmDeleteItem()">
    <p>Do you want to delete this item?</p>
    <button class="btn green" type="submit">Submit</button>
    <button class="btn" type="reset" (click)="onCancelToDelete()">Back</button>
  </form>
</dialog>
