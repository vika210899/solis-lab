<dialog [open]="isOpen" [class.active]="isOpen">
  <form id="toAddItem" class="form" (ngSubmit)="onAuth()">
    <h4>Sign in:</h4>
    <div class="option">
      <label for="productsToAddName">Email: </label>
      <input
        type="text"
        placeholder="Email"
        maxlength="30"
        id="productsToAddName"
        name="newName"
        [(ngModel)]="newName"
        required
      />
    </div>
    <button class="btn green" type="submit">Submit</button>
    <button class="btn" type="reset" (click)="onCancel()">Back</button>
  </form>
</dialog>
