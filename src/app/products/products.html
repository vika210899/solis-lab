<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products</title>
  </head>
  <body>
    <div class="container">
      <ul id="products">
        @for (product of selectedCategoryProducts; track product.id) {
          <li>
            <app-product-card [product]="product" (select)="onSelectProduct($event)" />
          </li>
        }
      </ul>
    </div>
  </body>
</html>
