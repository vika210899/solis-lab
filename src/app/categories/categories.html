@if (selectedCategoryId) {
  <div class="container">
    <h2>Jewelry - {{ selectedCategory()?.name }}</h2>
    <div class="flex">
      <app-menu-side />
      <section class="section-card-flex">
        <app-products />
      </section>
    </div>
  </div>
} @else {
  <div class="container">
    <h2>Jewelry Catalog</h2>
    <ul id="categories" class="card-flex">
      @for (category of categories; track category.id) {
        <li>
          <div class="card">
            <h3 for="card">{{ category.name }}</h3>
            <button id="card" class="btn-menu" (click)="onSelectCategory(category.id)">
              See more
            </button>
          </div>
        </li>
      }
    </ul>
  </div>
  <div class="container">
    <h2>Jewelry Gallery</h2>
    <section class="card-flex">
      <app-products />
    </section>
  </div>
}
