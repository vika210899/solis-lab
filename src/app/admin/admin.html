<h1 id="adminSide">Admin side</h1>
<h2>
  Jewelry
  {{
    categoriesService.getSelectedCategory()()
      ? ' - ' + categoriesService.getSelectedCategory()()?.name
      : ''
  }}
</h2>

<div class="flex">
  <aside>
    <ul id="categories" class="aside-card-flex">
      @for (category of categories; track category.id) {
        <li>
          <a
            [class.active]="category.id === categoriesService.getSelectedCategory()()?.id"
            (click)="onSelectCategory(category.id)"
            >{{ category.name }}</a
          >
        </li>
      }
    </ul>
  </aside>
  <section class="section-card-flex">
    <app-products-admin />
  </section>
</div>
