<app-product-card-template>
  @if (product) {
    <img src="/{{ product.picture }}" alt="{{ product.name }} Picture" />
    <h4>"{{ product.name }}"</h4>
    @if (product.inStock) {
      <button class="btn green" (click)="onStartArchiveItem()">Archive item</button>
    } @else {
      <p>temporary no available</p>
      <button class="btn green" (click)="onStartUnarchiveItem()">Unarchive item</button>
    }
    <!-- <app-product-details [product]="product" /> -->
    <!-- <button class="btn" (click)="onSelectedProduct()">Show me</button> -->

    <button class="btn pink" (click)="onStartDeleteItem()">Delete item</button>
  }
</app-product-card-template>

<dialog (click)="onCancelToArchive()" [open]="isOpenToArchieveForm">
  <form id="toArchive" class="form" (ngSubmit)="onArchiveItem()">
    <p>Do you want to archieve this item?</p>
    <button class="btn green" type="submit">Submit</button>
    <button class="btn" type="reset" (click)="onCancelToArchive()">Back</button>
  </form>
</dialog>

<dialog (click)="onCancelToInStock()" [open]="isOpenInStockForm">
  <form id="toInStock" class="form" (ngSubmit)="onUnarchiveItem()">
    <p>Do you want to unarchieve this item?</p>
    <button class="btn green" type="submit">Submit</button>
    <button class="btn" type="reset" (click)="onCancelToInStock()">Back</button>
  </form>
</dialog>

<dialog (click)="onCancelToDelete()" [open]="isOpenDeleteForm">
  <form id="toDelete" class="form" (ngSubmit)="onDeleteItem()">
    <p>Do you want to delete this item?</p>
    <button class="btn green" type="submit">Submit</button>
    <button class="btn" type="reset" (click)="onCancelToDelete()">Back</button>
  </form>
</dialog>
