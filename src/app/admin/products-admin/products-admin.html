<button class="btn green btn-medium" (click)="onStartAddItem()">Add item</button>
<app-new-item [isOpen]="isOpenAddingForm" (cancel)="onCancelAddItem()" />

<div class="container">
  <ul id="products" class="card-flex">
    @for (product of selectedCategoryProducts; track product.id) {
      <li>
        <app-product-card-admin [product]="product" (select)="onSelectProduct($event)" />
      </li>
    }
  </ul>
</div>
